name: Precifica - coleta Booking
on:
  push:
    branches: [main]
    paths: ['hotels.json', 'collector.mjs', '.github/workflows/collect.yml']
  workflow_dispatch:
    inputs:
      hotel_url:
        description: 'URL do hotel para coleta imediata (opcional)'
        required: false
        type: string
  schedule:
    - cron: '15 */6 * * *'
permissions:
  contents: write
concurrency:
  group: booking-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Incluir hotel solicitado
        if: github.event.inputs.hotel_url != ''
        env:
          HOTEL_URL: ${{ github.event.inputs.hotel_url }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const u=new URL(process.env.HOTEL_URL);
            if(!["booking.com","www.booking.com"].includes(u.hostname)||!/^\\/hotel\\/[a-z]{2}\\/[a-z0-9._-]+\\.html$/.test(u.pathname))process.exit(1);
            const url=u.origin+u.pathname;
            const hotels=JSON.parse(fs.readFileSync("hotels.json","utf8"));
            if(!hotels.some(h=>h.url===url)){if(hotels.length>=40)process.exit(1);hotels.push({name:u.pathname.split("/").pop().replace(".html","").replace(/[-_]/g," "),url});fs.writeFileSync("hotels.json",JSON.stringify(hotels,null,2));}
          '
      - run: npm run collect
      - name: Publicar dados reais
        run: |
          git config user.name "precifica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ hotels.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar tarifas verificadas"
            git push
          fi
